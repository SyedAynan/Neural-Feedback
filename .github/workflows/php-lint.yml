name: PHP lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - name: PHP syntax check
        run: |
          shopt -s globstar
          fail=0
          for f in **/*.php; do
            php -l "$f" || fail=1
          done
          exit $fail
